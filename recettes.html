<body>

    <nav>
        <a href="dashboard.html">Tableau de bord</a>

    <h1>Recettes</h1>

    <h2>Ajouter une recette</h2>

    <form onsubmit="ajouterRecette(event)">
        <label for="date">📆Date</label>
        <input type="date" id="date">

        <label for="montant">💳Montant</label>
        <input type="number" id="montant" placeholder="Ex : 10000">

        <label for="categorie">🏷️Catégorie</label>
        <select id="categorie">
            <option value="">Choisir une catégorie</option>
            <option>Impression</option>
            <option>Sublimation</option>
            <option>Design graphique</option>
            <option>Autres services</option>
        </select>

        <label for="libelle">📝Libellé</label>
        <input type="text" id="libelle" placeholder="Description de la recette">

        <button type="submit">Ajouter la recette</button>
    </form>

    <h2>Liste des recettes</h2>

<table>
    <tr>
        <th>Date</th>
        <th>Montant</th>
        <th>Catégorie</th>
        <th>Libellé</th>
    </tr>

    <tbody id="liste-recettes">
    </tbody>
</table>


</table>


    <script src="ressources/js/script.js"></script>

</body>
</html>
